services:
  gpui-telegram-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpui-telegram-web
    restart: unless-stopped
    ports:
      - "${PORT:-4173}:4173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4173
      DATA_DIR: /data
      ENABLE_TEST_RESET: "0"
    volumes:
      - gpui_telegram_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4173/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gpui_telegram_data:
