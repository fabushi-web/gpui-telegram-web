services:
  gpui-telegram-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpui-telegram-web
    restart: unless-stopped
    ports:
      - "${PORT:-4173}:4173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4173
      DATA_DIR: /data
      SESSION_SECRET: "${SESSION_SECRET:-}"
      UPSTREAM_SERVER_URL: "${UPSTREAM_SERVER_URL:-}"
      OMBHRUM_API_URL: "${OMBHRUM_API_URL:-https://api.ombhrum.com}"
      AI_GATEWAY_URL: "${AI_GATEWAY_URL:-https://api.ombhrum.com/v1}"
      AI_GATEWAY_API_KEY: "${AI_GATEWAY_API_KEY:-}"
      TURN_URIS: "${TURN_URIS:-}"
      TURN_SECRET: "${TURN_SECRET:-}"
      SEED_DEMO_DATA: "0"
      ALLOW_DEMO_AUTH: "0"
      EXPOSE_DEV_OTP_CODE: "0"
      ENABLE_TEST_RESET: "0"
    volumes:
      - gpui_telegram_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4173/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gpui_telegram_data:
