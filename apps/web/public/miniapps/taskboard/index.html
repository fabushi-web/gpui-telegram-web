<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskBoard · Sprint Kanban</title>
  <script src="../../js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px 16px 68px;
      background: #0E1621;
      color: #F5F5F5;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }
    h1 {
      font-size: 18px;
      margin: 0;
    }
    .count-pill {
      padding: 4px 10px;
      border-radius: 999px;
      background: #182533;
      border: 1px solid #2B5278;
      font-size: 12px;
      color: #64B5F6;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    input {
      flex: 1;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #242F3D;
      background: #17212B;
      color: #F5F5F5;
      font-size: 13px;
      outline: none;
    }
    input:focus {
      border-color: #3390EC;
    }
    button.primary-btn {
      padding: 9px 16px;
      border-radius: 8px;
      border: none;
      background: #3390EC;
      color: #FFFFFF;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .kanban-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    @media (max-width: 520px) {
      .kanban-grid { grid-template-columns: 1fr; }
    }
    .col {
      background: #17212B;
      border: 1px solid #242F3D;
      border-radius: 10px;
      padding: 10px;
    }
    .col-title {
      font-size: 12px;
      font-weight: 700;
      color: #7F91A4;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li.task-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      padding: 9px 10px;
      border-radius: 8px;
      background: #182533;
      border: 1px solid #242F3D;
      margin-bottom: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    li.task-card:hover {
      border-color: #3390EC;
    }
    .status-tag {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
      background: #2B5278;
      color: #64B5F6;
      white-space: nowrap;
    }
    .status-tag[data-status="done"] {
      background: rgba(0, 201, 114, 0.16);
      color: #00C972;
    }
    .status-tag[data-status="doing"] {
      background: rgba(229, 160, 48, 0.18);
      color: #E5A030;
    }
  </style>
</head>
<body>
  <header>
    <h1>📋 TaskBoard · Sprint Kanban</h1>
    <span class="count-pill" id="task-summary-pill">3 tasks</span>
  </header>

  <div class="row">
    <input id="task-input" placeholder="Add sprint task to CloudStorage…" />
    <button id="btn-add-task" class="primary-btn" type="button">Add</button>
  </div>

  <div class="kanban-grid">
    <section class="col" data-col="todo">
      <div class="col-title">Todo 待办</div>
      <ul id="col-todo"></ul>
    </section>
    <section class="col" data-col="doing">
      <div class="col-title">Doing 进行中</div>
      <ul id="col-doing"></ul>
    </section>
    <section class="col" data-col="done">
      <div class="col-title">Done 已完成</div>
      <ul id="col-done"></ul>
    </section>
  </div>

  <ul id="task-list" aria-label="All sprint tasks"></ul>

  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      var items = [
        { title: 'Verify WebSocket PTS sync', status: 'done' },
        { title: 'Ship Mini App CloudStorage', status: 'doing' },
        { title: 'Audit zero-purple dark palette', status: 'todo' }
      ];

      function normalizeItems(raw) {
        if (!Array.isArray(raw)) return items;
        return raw.map(function (entry) {
          if (typeof entry === 'string') return { title: entry, status: 'todo' };
          return {
            title: String(entry.title || ''),
            status: entry.status === 'doing' || entry.status === 'done' ? entry.status : 'todo'
          };
        }).filter(function (e) { return e.title.length > 0; });
      }

      function persist() {
        if (tg && tg.CloudStorage) {
          tg.CloudStorage.setItem('sprint_tasks', JSON.stringify(items));
        }
      }

      function nextStatus(s) {
        if (s === 'todo') return 'doing';
        if (s === 'doing') return 'done';
        return 'todo';
      }

      function render() {
        var ulAll = document.getElementById('task-list');
        var ulTodo = document.getElementById('col-todo');
        var ulDoing = document.getElementById('col-doing');
        var ulDone = document.getElementById('col-done');
        ulAll.innerHTML = '';
        ulTodo.innerHTML = '';
        ulDoing.innerHTML = '';
        ulDone.innerHTML = '';

        items.forEach(function (item, idx) {
          var card = document.createElement('li');
          card.className = 'task-card';
          var span = document.createElement('span');
          span.textContent = item.title;
          var tag = document.createElement('span');
          tag.className = 'status-tag';
          tag.setAttribute('data-status', item.status);
          tag.textContent = item.status.toUpperCase();
          card.appendChild(span);
          card.appendChild(tag);
          card.addEventListener('click', function () {
            items[idx].status = nextStatus(items[idx].status);
            render();
            persist();
            if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
          });

          if (item.status === 'done') ulDone.appendChild(card);
          else if (item.status === 'doing') ulDoing.appendChild(card);
          else ulTodo.appendChild(card);

          var summaryLi = document.createElement('li');
          summaryLi.className = 'task-card';
          summaryLi.textContent = item.title + ' [' + item.status + ']';
          ulAll.appendChild(summaryLi);
        });

        var pill = document.getElementById('task-summary-pill');
        if (pill) pill.textContent = items.length + ' tasks';
      }

      if (tg) {
        tg.ready();
        tg.expand();
        if (tg.CloudStorage) {
          tg.CloudStorage.getItem('sprint_tasks', function (err, val) {
            if (!err && val) {
              try {
                items = normalizeItems(JSON.parse(val));
                render();
              } catch (_) {}
            }
          });
        }
        tg.MainButton.setText('Sync Board to Chat').show().onClick(function () {
          tg.sendData({ action: 'sync_tasks', count: items.length, tasks: items });
        });
      }

      function addTask() {
        var inp = document.getElementById('task-input');
        var v = (inp.value || '').trim();
        if (!v) return;
        items.push({ title: v, status: 'todo' });
        inp.value = '';
        render();
        persist();
      }

      document.getElementById('btn-add-task').addEventListener('click', addTask);
      document.getElementById('task-input').addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' && !ev.isComposing) {
          ev.preventDefault();
          addTask();
        }
      });

      render();
    })();
  </script>
</body>
</html>
