app = "gpui-telegram-web"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "4173"
  DATA_DIR = "/data"
  OMBHRUM_API_URL = "https://api.ombhrum.com"
  AI_GATEWAY_URL = "https://api.ombhrum.com/v1"
  SEED_DEMO_DATA = "0"
  ALLOW_DEMO_AUTH = "0"
  EXPOSE_DEV_OTP_CODE = "0"
  ENABLE_TEST_RESET = "0"

[mounts]
  source = "gpui_telegram_data"
  destination = "/data"

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/v1/health"
