services:
  - type: web
    name: fabushi-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "4173"
      - key: DATA_DIR
        value: /data
      - key: GPUI_MASTER_SECRET
        generateValue: true
      - key: FABUSHI_CLOUD_GATEWAY_URL
        value: https://api.ombhrum.com
      - key: FABUSHI_AI_GATEWAY_URL
        value: https://ai.ombhrum.com
      - key: TURN_SECRET
        sync: false
      - key: SEED_DEMO_DATA
        value: "0"
      - key: ALLOW_DEMO_AUTH
        value: "0"
      - key: EXPOSE_DEV_OTP_CODE
        value: "0"
      - key: ENABLE_TEST_RESET
        value: "0"
    disk:
      name: fabushi-web-sqlite-wal
      mountPath: /data
      sizeGB: 2
