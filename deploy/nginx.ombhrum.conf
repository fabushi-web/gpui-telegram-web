# Nginx reverse proxy configuration for web.ombhrum.com -> gpui-telegram-web (:4173)
# Supports HTTP/1.1 WebSockets (/api/v1/ws, /api/v1/browser/ws), SSE streaming,
# HTTP 206 Range media streaming, and 833KB Fabushi WASM delivery.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream gpui_telegram_web_backend {
    server 127.0.0.1:4173;
    keepalive 32;
}

server {
    listen 80;
    server_name web.ombhrum.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name web.ombhrum.com;

    ssl_certificate     /etc/letsencrypt/live/web.ombhrum.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.ombhrum.com/privkey.pem;

    client_max_body_size 128M;

    # Ensure .wasm serves with application/wasm for WebAssembly.instantiateStreaming
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    # WebSocket endpoints
    location ~ ^/api/v1/(ws|browser/ws)$ {
        proxy_pass http://gpui_telegram_web_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SSE & API endpoints (disable proxy buffering for instant streaming tokens)
    location /api/ {
        proxy_pass http://gpui_telegram_web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
    }

    # Static SPA & Fabushi MiniApp WASM assets
    location / {
        proxy_pass http://gpui_telegram_web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
